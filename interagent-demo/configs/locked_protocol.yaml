# InterAgent Demo — Locked Protocol
# 在正式实验前冻结，所有模块必须读取此文件

threshold:
  definition: "1.5 × median(P99_baseline_runs)"
  value_us: 2250    # baseline P99≈1500us ×1.5
  frozen_at: "2026-07-30"
  note: "δ = 2.25ms. 一旦冻结，报告/搜索/确认/hazard 必须使用同一值。"

victim:
  name: periodic_memory_victim
  clock: CLOCK_MONOTONIC
  sleep: clock_nanosleep(TIMER_ABSTIME)
  default_params:
    period_us: 10000
    duration_s: 60
    working_set_kib: 1024
    cpu: 1
    stride: 64

environment:
  monitoring_interval_ms: 250     # 环境采样周期
  required_fields:
    - cpu_freq_khz
    - temperature_mC
    - governor
    - loadavg
  optional_fields:
    - perf_cache_misses
    - perf_instructions

evidence_rules:
  candidate_threshold: "P99 > δ"
  confirmed_threshold: "≥4 of 5 reproductions exceed δ"
  negative_controls:
    - attacker_disabled      # effect must diminish
    - low_duty_cycle         # mechanism-specific
    - core_relocation        # topology robustness (NOT topology neg-ctrl)
  valid_states:
    - supported
    - contradicted
    - indistinguishable
    - unresolved
    - environment_confounded
    - budget_exhausted
  recovery_criterion: "attacker-off P99 within 95% bootstrap CI of baseline P99"

search_space:
  freeze_principle: "根据硬件能力预定义；不根据candidate rate裁剪"
  version: v1
