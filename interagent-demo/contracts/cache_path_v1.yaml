id: cache_path_v1
resource_family: cache_memory_path

generator:
  name: cache_attacker
  parameters:
    working_set_kib: [1024, 4096, 16384]
    access: [sequential, random]
    cpu: [0, 2, 3]

victim:
  cpu: 1

observations:
  required:
    - victim_response_time
  optional:
    - cache_misses

negative_controls:
  - attacker_disabled
  - small_working_set
  - attacker_cpu_changed

conclusion_limit: cache_memory_path
